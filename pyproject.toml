[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lazythin"
version = "0.1.0"
description = "Terminal manager for Syncthing: live TUI dashboard plus one-command conflict-file resolution. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "hht233" }]
keywords = ["syncthing", "tui", "terminal", "dashboard", "conflict", "sync", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/heht24-cyber/lazythin"
Repository = "https://github.com/heht24-cyber/lazythin"
Issues = "https://github.com/heht24-cyber/lazythin/issues"

[project.scripts]
lazythin = "lazythin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
